name: mojiworks
description: >-
  Mojiworks is a UK-based social games studio, backed by Balderton Capital, that
  is pioneering a game genre it calls MuGC (Multi-User Generative Creation) —
  living, collaborative worlds that communities and AI systems build together.
  Its released titles include Ready Chef Go, Trivia Party, Chef Showdown and
  Hatch Cats, and it is building its first MuGC world as a persistent,
  community-shaped city. The company publishes a public AI Ethics Policy
  committing to licensed training data, environmental accountability, human
  oversight and content-safety controls. Mojiworks does not currently expose a
  public developer platform, API, or SDK; this profile is maintained in the API
  Evangelist network as a company record and enrichment lead.
